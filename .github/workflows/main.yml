name: Server Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # CHANGED: match the server (node -v there is 22.x), so native modules load
      - name: Setup Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Clear Next.js cache
        run: rm -rf .next

      - name: Generate Prisma client
        run: |
         npx prisma db push
         npx prisma generate

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          python3 -c "
          import os
          key = os.environ['SSH_KEY']
          with open(os.path.expanduser('~/.ssh/id_ed25519'), 'w') as f:
              f.write(key + '\n')
          "
          chmod 600 ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}

      # NEW: safety net. Copies the SQLite file(s) and uploads aside before every deploy.
      - name: Back up server data
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.APP_PATH }}
            mkdir -p ~/backups
            ts=$(date +%Y%m%d-%H%M%S)
            [ -f dev.db ] && cp dev.db ~/backups/root-dev.db-$ts
            [ -f prisma/dev.db ] && cp prisma/dev.db ~/backups/prisma-dev.db-$ts
            [ -f /home/gulfcart/data/blog.db ] && cp /home/gulfcart/data/blog.db ~/backups/blog.db-$ts
            [ -d public/uploads ] && tar czf ~/backups/uploads-$ts.tgz public/uploads
            # keep the newest 20 backups
            ls -1t ~/backups | tail -n +21 | xargs -r -I{} rm -f ~/backups/{}
            echo "backup done: $ts"
          EOF

      - name: Copy files to server
        run: |
          # CHANGED: '/node_modules' only skips the ROOT folder. The old
          # 'node_modules' pattern also skipped .next/node_modules and
          # .next/standalone/node_modules, which the standalone server needs.
          # CHANGED: SQLite files and public/uploads are protected from --delete / overwrite
          # (rsync never deletes or overwrites an excluded path on the server).
          # Better: move the DB outside the deploy folder, see the notes in chat.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='/node_modules' \
            --exclude='/dev.db*' \
            --exclude='/prisma/dev.db*' \
            --exclude='/public/uploads' \
            --no-times \
            --no-perms \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}/

      - name: Install & Restart on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e # Exit immediately if a command exits with a non-zero status
            cd ${{ secrets.APP_PATH }}

            # 0. NEW: the database lives OUTSIDE the deploy folder, at an absolute path.
            #    (A relative path breaks: the standalone server runs from .next/standalone.)
            #    Refuse to deploy if it is missing, so the app never starts on an empty DB.
            DB_FILE=/home/gulfcart/data/blog.db
            [ -f "$DB_FILE" ] || { echo "ERROR: $DB_FILE not found. Copy your dev.db there first."; exit 1; }

            # 1. Install production dependencies
            npm ci --omit=dev --ignore-scripts
            # CHANGED: --ignore-scripts skips building native modules, so build this one here
            npm rebuild better-sqlite3

            # 2. Setup Next.js standalone assets
            rm -rf .next/standalone/.next/static
            cp -r .next/static .next/standalone/.next/
            rm -rf .next/standalone/public
            cp -r public .next/standalone/public

            # 3. CHANGED: write .env from the GitHub secrets (this step did not exist)
            umask 077
            printf '%s\n' \
              'RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}' \
              "DATABASE_URL=file:$DB_FILE" \
              > .env
            chmod 600 .env
            echo ".env written ($(wc -l < .env) lines)."

            # 4. Write ecosystem.config.js (this is what pm2 actually passes to the app)
            RESEND_KEY='${{ secrets.RESEND_API_KEY }}' \
            DATABASE_URL="file:$DB_FILE" \
            node -e "
            const fs = require('fs');
            const config = {
              apps: [{
                name: 'Gulfcart-main',
                script: '.next/standalone/server.js',
                cwd: process.cwd(),
                env: {
                  NODE_ENV: 'production',
                  PORT: '3002',
                  RESEND_API_KEY: process.env.RESEND_KEY,
                  DATABASE_URL: process.env.DATABASE_URL
                }
              }]
            };
            fs.writeFileSync('ecosystem.config.js', 'module.exports = ' + JSON.stringify(config, null, 2));
            console.log('ecosystem.config.js written successfully.');
            "

            # 5. Restart or Start the app via PM2
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
          EOF